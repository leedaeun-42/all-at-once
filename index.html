<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마지막 비트 — 생각</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bytesized&family=Gaegu&display=swap">
<style>
  :root { --bg: #000; --fg: #fff; --dim: #666; --line: 2px; --ko: 'Galmuri11', 'Galmuri9', monospace; --en: 'Bytesized', 'Galmuri11', monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: var(--ko); display: grid; place-items: center; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #stage { position: relative; width: min(100vw, 160vh); aspect-ratio: 16 / 10; background: var(--bg); overflow: hidden; font-size: clamp(13px, 1.75vw, 28px); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  canvas.bmp { image-rendering: pixelated; display: block; }
  #label { position: absolute; top: 3.2%; left: 4%; font-family: var(--en); font-size: 1.1em; letter-spacing: .06em; color: #fff; mix-blend-mode: difference; z-index: 3; }

  /* 보조 창 (공책, 작품) */
  #view { position: absolute; left: 4%; top: 10%; width: 46%; height: 54%; border: var(--line) solid var(--fg); background: var(--bg); display: none; flex-direction: column; z-index: 2; }
  #view.show { display: flex; animation: up .4s both; }
  #view .hd { padding: .35em .8em; border-bottom: var(--line) solid var(--fg); font-size: .74em; display: flex; justify-content: space-between; }
  #view .hd span:last-child { font-family: var(--en); color: #aaa; }
  #view .bd { flex: 1; overflow-y: auto; padding: .8em; display: grid; place-items: center; scrollbar-width: thin; scrollbar-color: #fff #000; }
  #view .bd canvas { width: 100%; }
  .pages { display: flex; flex-direction: column; gap: .8em; width: 100%; align-self: start; }
  .pages canvas { border: 1px solid #555; }

  /* 카드 + 생각 */
  #veil { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 2; display: none; background: repeating-conic-gradient(#000 0 25%, transparent 0 50%) 0 0 / 4px 4px; }
  #veil.show { display: block; animation: fade .3s both; }
  #side { position: absolute; left: 0; right: 0; top: 4%; height: 64%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9em; z-index: 3; pointer-events: none; }
  #side.right { left: 54%; right: 4%; }
  .flip { position: relative; height: 66%; aspect-ratio: 7 / 12; perspective: 1000px; flex: none; animation: deal .5s both; }
  .flip .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,1.4,.5,1); }
  .flip.on .in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6% / 3.5%; overflow: hidden; container-type: size; }
  .face canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .front { transform: rotateY(180deg); }
  .front .num, .front .nm { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--en); color: #000; letter-spacing: .12em; }
  .front .num { top: 4.5%; font-size: 7.5cqh; line-height: 1; }
  .front .nm { bottom: 5.5%; font-size: 6.5cqh; line-height: 1; }
  .cap { font-size: .74em; background: #fff; color: #000; padding: .35em .9em; max-width: 100%; text-align: center; word-break: keep-all; line-height: 1.6; animation: up .4s both; }
  .spread { height: 72%; display: flex; align-items: center; justify-content: center; }
  .spread .flip { height: 100%; margin: 0 -1.1em; rotate: var(--r); cursor: pointer; pointer-events: auto; transition: translate .25s, opacity .4s, rotate .4s; }
  .spread .flip:hover { translate: 0 -.8em; }
  .spread .flip.gone { opacity: 0; translate: 0 1.5em; pointer-events: none; }
  .spread .flip.chosen { rotate: 0deg; translate: 0 -.4em; z-index: 2; cursor: default; }
  .echo { display: flex; flex-direction: column; align-items: center; gap: .15em; font-size: .52em; color: #888; max-width: 90%; text-align: center; }
  .echo span { animation: drift 2.4s ease-out both; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .answer { display: flex; align-items: stretch; gap: .5em; border: var(--line) solid var(--fg); background: var(--bg); padding: .35em .35em .35em 1em; max-width: 92%; }
  .answer .f { font-size: .8em; align-self: center; min-width: 12em; }
  .answer .f::after { content: '▏'; animation: blink 1s steps(1) infinite; }
  @keyframes drift { from { opacity: 0; transform: translateY(.8em); } 60% { opacity: 1; } to { opacity: .55; } }
  .gift { height: 72%; }
  .gift.glow .back canvas { animation: pulse 1.4s ease-in-out infinite; }
  .opt.take { pointer-events: auto; font-size: .9em; background: var(--fg); color: var(--bg); padding: .5em 2.2em; box-shadow: .25em .25em 0 #555; animation: up .4s .2s both; }
  .opt.take:hover { background: var(--bg); color: var(--fg); }
  .taken { transition: translate .5s ease-in, scale .5s ease-in, opacity .5s; translate: 0 3em; scale: .6; opacity: 0; }
  .thought { border: var(--line) dashed #fff; border-radius: 1.2em; padding: .5em .9em; background: #000; animation: up .5s both; max-width: 100%; }
  .thought canvas { height: 1.5em; width: auto; max-width: 100%; }
  .thought.two canvas { height: 3em; }

  /* 선택지 */
  #choices { position: absolute; left: 4%; right: 4%; bottom: 32%; display: none; flex-wrap: wrap; justify-content: center; gap: .6em; z-index: 6; }
  #choices.show { display: flex; animation: up .3s both; }
  .opt { font: inherit; font-size: .8em; background: var(--bg); color: var(--fg); border: var(--line) solid var(--fg); padding: .55em 1.2em; cursor: pointer; }
  .opt:hover, .opt:focus-visible { background: var(--fg); color: var(--bg); outline: none; }

  /* 대사창 + 점성술사 버튼 */
  #box { position: absolute; left: 4%; right: 4%; bottom: 4%; height: 24%; border: var(--line) solid var(--fg); background: var(--bg); padding: 1em 1.4em; line-height: 1.75; display: none; cursor: pointer; z-index: 5; }
  #box.show { display: block; }
  #name { position: absolute; top: -1.05em; left: 1em; background: var(--fg); color: var(--bg); padding: .1em .7em; font-size: .8em; }
  #name:empty { display: none; }
  #text { font-size: .9em; }
  #box:has(#ask.show) #text { padding-right: 11em; }
  #more { position: absolute; right: 1em; bottom: .5em; font-family: var(--en); animation: blink 1s steps(1) infinite; visibility: hidden; }
  #more.show { visibility: visible; }
  #ask { position: absolute; right: .9em; top: .8em; z-index: 7; display: none; align-items: center; gap: .55em; font: inherit; font-size: .72em; background: var(--fg); color: var(--bg); border: var(--line) solid var(--fg); padding: .45em 1em .45em .8em; cursor: pointer; transition: font-size .6s; box-shadow: .25em .25em 0 #555; }
  #ask.show { display: flex; }
  #ask:hover:not(:disabled), #ask:focus-visible { background: var(--bg); color: var(--fg); outline: none; }
  #ask:active:not(:disabled) { translate: .15em .15em; box-shadow: .1em .1em 0 #555; }
  #ask:disabled { cursor: default; }
  #ask i { width: .8em; height: 1.25em; border: 2px solid currentColor; border-radius: .12em; background: repeating-conic-gradient(currentColor 0 25%, transparent 0 50%) 0 0 / 4px 4px; flex: none; }
  #ask.hot { animation: pulse 1.1s ease-in-out infinite; }
  #ask.hot::after { content: ''; position: absolute; inset: -.35em; border: 1px dashed var(--fg); animation: blink 1s steps(1) infinite; pointer-events: none; }
  #nudge { position: absolute; right: 4%; bottom: calc(28% + .6em); z-index: 7; font-size: .62em; background: #fff; color: #000; padding: .3em .8em; border-radius: .8em .8em .1em .8em; display: none; animation: up .3s both; }
  #nudge.show { display: block; }

  #next { position: absolute; right: 4%; bottom: 5%; font-family: var(--en); display: none; animation: blink 1s steps(1) infinite; z-index: 6; }
  #next.show { display: block; }

  /* 전체 화면 */
  #card { position: absolute; inset: 0; background: var(--bg); display: none; place-items: center; text-align: center; cursor: pointer; padding: 6%; z-index: 8; }
  #card.show { display: grid; animation: fade .6s both; }
  .cover h1 { font-weight: 400; font-size: 3em; letter-spacing: .08em; }
  .cover .en { font-family: var(--en); font-size: 1.3em; letter-spacing: .3em; margin-top: .3em; }
  .cover .meta { margin-top: 2.4em; font-size: .7em; color: var(--dim); line-height: 1.9; }
  .tap { position: absolute; bottom: 6%; left: 0; right: 0; font-size: .7em; color: var(--dim); animation: blink 1.4s steps(1) infinite; }
  .chap { font-size: 1.3em; }
  .ending { display: flex; flex-direction: column; align-items: flex-start; gap: .9em; }
  .ending .it { min-height: 1.6em; display: flex; align-items: center; animation: fade 1s both; }
  .ending .it canvas { height: 1.6em; }
  .ending .it .pr { font-size: .8em; background: #fff; color: #000; padding: .2em .7em; }
  .ending .it.glitch { animation: glitch .12s steps(2) 6; }
  .ending .last { margin-top: 2.2em; font-size: .85em; color: #bbb; animation: fade 2s both; align-self: center; }

  .crt { position: absolute; inset: 0; z-index: 9; background: #000; display: grid; place-items: center; }
  .crt i { display: block; background: #fff; animation: crt 1.1s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes crt { 0% { width: 100%; height: 100%; opacity: .9; } 45% { width: 100%; height: 3px; opacity: 1; } 80% { width: 6px; height: 3px; } 100% { width: 0; height: 0; } }
  .fin { display: flex; flex-direction: column; align-items: center; animation: fade 1.2s both; }
  .fin-k { font-size: 1.1em; letter-spacing: .5em; margin-bottom: .2em; }
  .fin-end { font-family: var(--en); font-size: 6em; line-height: 1; letter-spacing: .12em; }
  .fin-rule { width: 9em; height: 0; border-top: 2px solid #fff; margin: 1.4em 0 1.2em; }
  .fin-t { font-size: 1.15em; letter-spacing: .1em; }
  .fin-en { font-family: var(--en); letter-spacing: .35em; margin-top: .3em; font-size: .85em; }
  .fin-meta { margin-top: 1.6em; font-size: .65em; color: #888; }
  .fin-out { position: absolute; bottom: 13%; left: 0; right: 0; font-size: .75em; color: #ddd; animation: fade 1s both; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { opacity: 0; transform: translateY(.6em); } }
  @keyframes deal { from { opacity: 0; transform: translateY(-1.5em) rotate(-6deg); } }
  @keyframes shuffle { 0% { transform: translateX(-.25em) rotate(-3deg); } 100% { transform: translateX(.25em) rotate(3deg); } }
  @keyframes glitch { 0% { opacity: 0; } 100% { opacity: 1; transform: translateX(.2em); } }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="label"></div>
  <div id="view"><div class="hd"><span id="vt"></span><span id="vs"></span></div><div class="bd" id="vb"></div></div>
  <div id="veil"></div>
  <div id="side"></div>
  <div id="choices"></div>
  <div id="nudge"></div>
  <div id="box"><div id="name"></div><div id="text"></div><div id="more">▼</div><button id="ask" type="button"><i></i>카드 뽑기</button></div>
  <div id="next">▼</div>
  <div id="card"></div>
</div>

<script>
/* ───────────── 기본 ───────────── */
const $ = s => document.querySelector(s);
const W = 320, H = 200;
const cv = $('#cv'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H;
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const T = '점성술사';

/* ───────────── 1비트 그리기 ───────────── */
function bmp(w, h, fn, { invert = false, fat = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.className = 'bmp';
  const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  const px = new Uint8Array(w * h);
  const raw = (x, y, v = 1) => { if (x < 0 || y < 0 || x >= w || y >= h) return; px[y * w + x] = v ? 1 : 0; };
  // fat: 모든 점을 2×2 블록으로 찍어 화면 전체의 픽셀 크기를 맞춘다
  const set = fat ? (x, y, v = 1) => { x = Math.round(x) & ~1; y = Math.round(y) & ~1; raw(x, y, v); raw(x + 1, y, v); raw(x, y + 1, v); raw(x + 1, y + 1, v); }
                  : (x, y, v = 1) => raw(Math.round(x), Math.round(y), v);
  const get = (x, y) => px[y * w + x];
  const lvAt = (lv, a, b) => typeof lv === 'function' ? lv(a, b) : lv;
  const dot = (X, Y, lv) => { const bx = fat ? Math.round(X) >> 1 : X, by = fat ? Math.round(Y) >> 1 : Y; set(X, Y, BAYER[((by % 4) + 4) % 4][((bx % 4) + 4) % 4] < lv ? 1 : 0); };
  const api = {
    w, h, set, get,
    line(x0, y0, x1, y1, v = 1) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) set(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, v); },
    hline(x0, x1, y, v = 1) { for (let x = x0; x <= x1; x++) set(x, y, v); },
    vline(x, y0, y1, v = 1) { for (let y = y0; y <= y1; y++) set(x, y, v); },
    circle(cx, cy, r, v = 1) { for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) { const dd = Math.hypot(x, y); if (dd <= r + .5 && dd > r - .6) set(cx + x, cy + y, v); } },
    disc(cx, cy, r, lv = 16) { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * .8) dot(Math.round(cx + x), Math.round(cy + y), lvAt(lv, x, y)); },
    rect(x, y, rw, rh, v = 1) { api.hline(x, x + rw, y, v); api.hline(x, x + rw, y + rh, v); api.vline(x, y, y + rh, v); api.vline(x + rw, y, y + rh, v); },
    frect(x, y, rw, rh, lv = 16) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) dot(x + i, y + j, lvAt(lv, i, j)); },
    clear(x, y, rw, rh) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) set(x + i, y + j, 0); },
    box(x, y, rw, rh, lv = 0) { api.frect(x, y, rw, rh, lv); api.rect(x, y, rw, rh); },
    // 픽셀 폰트 글자를 1비트로 찍는다
    text(str, x, y, { px = 11, font = 'Galmuri11', v = 1, align = 'left' } = {}) {
      const t = document.createElement('canvas'), tg = t.getContext('2d'); tg.font = `${px}px ${font}`;
      const tw = Math.ceil(tg.measureText(str).width) + 2, th = px + 4; t.width = tw; t.height = th;
      tg.font = `${px}px ${font}`; tg.fillStyle = '#fff'; tg.textBaseline = 'top'; tg.fillText(str, 1, 1);
      const td = tg.getImageData(0, 0, tw, th).data, ox = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x;
      for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++) if (td[(j * tw + i) * 4 + 3] > 140) raw(Math.round(ox + i), Math.round(y + j), v);
      return tw;
    },
    sprite(rows, ox, oy, sc = 1) { rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '.') return; for (let a = 0; a < sc; a++) for (let b2 = 0; b2 < sc; b2++) set(ox + x * sc + a, oy + y * sc + b2, ch === 'X' ? 1 : 0); })); },
    star(x, y, s = 2) { for (let k = -s; k <= s; k++) { set(x + k, y); set(x, y + k); } },
  };
  fn(api);
  for (let i = 0; i < w * h; i++) { const on = invert ? !px[i] : px[i]; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = on ? 255 : 0; d[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
}

/* 커서 손 (카드 시안과 같은 모양) */
const HAND = ['.....XX.........','....XOOX........','....XOOX........','....XOOX........','....XOOXXX......','....XOOXOOXXX...','....XOOXOOXOOXX.','.XX.XOOXOOXOOXOX','XOOXXOOOOOOOOXOX','XOOOXOOOOOOOOOOX','.XOOXOOOOOOOOOOX','..XOOOOOOOOOOOOX','..XOOOOOOOOOOOX.','...XOOOOOOOOOOX.','...XOOOOOOOOOX..','....XOOOOOOOOX..','....XOOOOOOOOX..','....XXXXXXXXXX..'];

/* 사람: 배경 슬라이드 만화와 같은 결. 흰 얼굴, 검은 머리, 검은 몸. 말하는 사람만 꽉 찬 몸 */
function person(b, cx, base, style, lit) {
  const hy = base - 46, r = 13;
  // 몸
  for (let y = 0; y < 30; y++) { const hw = 11 + y * .55; for (let x = -hw; x <= hw; x++) { const X = Math.round(cx + x), Y = base - 30 + y; if (lit || Math.abs(x) > hw - 1.5 || y === 0) b.set(X, Y); else b.set(X, Y, BAYER[(Y >> 1) & 3][(X >> 1) & 3] < 5 ? 1 : 0); } }
  b.hline(cx - 3, cx + 3, base - 31); b.vline(cx - 3, base - 34, base - 31); b.vline(cx + 3, base - 34, base - 31);
  // 얼굴
  b.disc(cx, hy, r, 0); b.circle(cx, hy, r);
  const hair = (fn) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r && fn(x, y)) b.set(cx + x, hy + y); };
  if (style === 0) { hair((x, y) => y < -7); b.rect(cx - 9, hy - 1, 6, 4); b.rect(cx + 3, hy - 1, 6, 4); b.hline(cx - 3, cx + 3, hy); }        // 교수: 짧은 머리, 안경
  if (style === 1) { hair((x, y) => y < -4 || (Math.abs(x) > 9 && y < 10)); for (let y = 0; y < 12; y++) { b.set(cx - r - 1, hy + y); b.set(cx - r, hy + y); b.set(cx + r, hy + y); b.set(cx + r + 1, hy + y); } } // 긴 머리
  if (style === 2) { hair((x, y) => y < -5 || (x < -8 && y < 2)); b.disc(cx + 2, hy - r - 4, 5, 16); }                                         // 올림머리
  if (style === 3) { hair((x, y) => y < -6); b.frect(cx - r, hy - r - 1, r * 2 + 1, 6, 16); b.frect(cx + r - 2, hy - 7, 10, 3, 16); }        // 모자
  if (style === 4) { hair((x, y) => y < -5 || (x > 6 && y < 0)); b.rect(cx - 9, hy - 1, 6, 4); b.rect(cx + 3, hy - 1, 6, 4); b.hline(cx - 3, cx + 3, hy); } // 안경, 옆가르마
  if (style === 5) { hair((x, y) => y < -6); b.disc(cx - r - 2, hy - 2, 4, 16); }                                                             // 묶은 머리
  // 눈, 입
  if (style !== 0 && style !== 4) { b.frect(cx - 6, hy, 2, 3, 16); b.frect(cx + 5, hy, 2, 3, 16); }
  else { b.set(cx - 6, hy + 1); b.set(cx + 6, hy + 1); }
  b.hline(cx - 2, cx + 2, hy + 7);
  if (lit) { b.set(cx - 1, hy + 8); b.set(cx + 1, hy + 8); }
}

/* 점성술사: 후드, 구슬, 양손 */
function teller(b, t = 0) {
  const cx = 160;
  const hood = (x, y) => y < 50 ? Math.hypot(x, (y - 48) * 1.1) < 44 : Math.abs(x) < 44 + (y - 50) * .9;
  // 후드와 망토: 하얗게 꽉 채운 덩어리 (예전 시안처럼 굵게)
  for (let y = 0; y < 125; y += 2) for (let x = -96; x <= 96; x += 2) if (hood(x, y)) b.set(cx + x, 20 + y);
  // 얼굴: 검은 테두리 안의 하얀 얼굴, 검은 앞머리
  for (let y = -22; y <= 24; y += 2) for (let x = -20; x <= 20; x += 2) if ((x * x) / 400 + (y * y) / 576 <= 1) b.set(cx + x, 62 + y, 0);
  for (let y = -18; y <= 20; y += 2) for (let x = -16; x <= 16; x += 2) if ((x * x) / 256 + (y * y) / 400 <= 1) b.set(cx + x, 62 + y, 1);
  for (let x = -18; x <= 18; x += 2) for (let y = 0; y < 10 - Math.abs(x) / 2.5; y += 2) b.set(cx + x, 44 + y, 0);
  const blink = t % 37 === 0;
  if (!blink) { b.frect(cx - 10, 62, 4, 6, 0); b.frect(cx + 6, 62, 4, 6, 0); } else { b.hline(cx - 10, cx - 6, 66, 0); b.hline(cx + 6, cx + 10, 66, 0); }

  if (BG.cast.length) { BG.speaker = who; drawBg(); }
  return new Promise(res => {
    let i = 0; const s = String(text);
    const id = setInterval(() => { textEl.textContent = s.slice(0, ++i); if (i >= s.length) done(); }, 30);
    const done = () => { clearInterval(id); typing = null; textEl.textContent = s; res(); };
    typing = { finish: done, stop: () => clearInterval(id) };
  });
}
const wait = () => new Promise(r => { resolver = r; });
async function say(E, who, text) {
  await type(who, text); live(E); if (skipFlag) return;
  moreEl.classList.add('show'); await wait(); live(E); moreEl.classList.remove('show');
}
const N = (E, text) => say(E, '', text);
async function fullCard(E, html, { auto } = {}) {
  card.innerHTML = html; card.classList.add('show'); box.classList.remove('show');
  if (auto) await sleep(auto); else await wait();
  live(E); card.classList.remove('show');
}
async function waitNext(E) { nextEl.classList.add('show'); await wait(); live(E); nextEl.classList.remove('show'); }

document.addEventListener('click', e => {
  resetIdle();
  if (e.target.closest('#ask') || e.target.closest('.opt') || e.target.closest('.answer') || e.target.closest('#view') || e.target.closest('.spread')) return;
  if (typing) { typing.finish(); return; }
  if (resolver) { const r = resolver; resolver = null; r('next'); }
});
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); document.body.click(); } });
askBtn.addEventListener('click', () => {
  if (!askBtn.classList.contains('show') || askBtn.disabled) return;
  skipFlag = true; setAsk(false); choicesEl.classList.remove('show');
  if (typing) typing.finish();
  if (resolver) { const r = resolver; resolver = null; r('skip'); }
});
function resetIdle() { clearTimeout(idleT); idleT = setTimeout(restart, 150000); }

async function choose(E, q, opts) {
  await type('', q); live(E); if (skipFlag) return null;
  choicesEl.innerHTML = ''; choicesEl.classList.add('show');
  const picked = await new Promise(res => {
    const arm = () => { resolver = v => v === 'skip' ? res(null) : arm(); };
    arm();
    opts.forEach(o => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = o.label; b.onclick = () => { resolver = null; choicesEl.classList.remove('show'); res(o); }; choicesEl.appendChild(b); });
  });
  live(E); return picked;
}
async function waitSkip(E) { let v; do { v = await wait(); live(E); } while (v !== 'skip'); }

/* 카드 뽑기: 펼쳐진 카드 중 한 장을 직접 고른다. 장면이 지날수록 펼치는 장수가 줄어든다 */
function flipEl({ ttl, num }) {
  const f = document.createElement('div'); f.className = 'flip';
  f.innerHTML = `<div class="in"><div class="face back"></div><div class="face front"><div class="num">${num}</div><div class="nm">${CARD_EN[ttl] || ''}</div></div></div>`;
  f.querySelector('.back').appendChild(CARD_BACK());
  f.querySelector('.front').prepend(cardArt(ART[ttl] || (() => {})));
  return f;
}
async function pickCard(E, data, n, prompt, echo = []) {
  clearSide();
  if (echo.length) { const ec = document.createElement('div'); ec.className = 'echo'; ec.innerHTML = echo.slice(-5).map((t, k) => `<span style="animation-delay:${k * 160}ms">${esc(t)}</span>`).join(''); side.appendChild(ec); }
  $('#veil').classList.add('show');
  const sp = document.createElement('div'); sp.className = 'spread';
  const cards = Array.from({ length: n }, (_, k) => { const f = flipEl(data); f.style.setProperty('--r', ((k - (n - 1) / 2) * 7) + 'deg'); f.style.animationDelay = k * 80 + 'ms'; sp.appendChild(f); return f; });
  side.appendChild(sp);
  type(T, prompt);
  const chosen = await new Promise(res => cards.forEach(f => f.addEventListener('click', () => res(f), { once: true })));
  live(E); if (typing) typing.finish(); box.classList.remove('show');
  side.querySelector('.echo')?.remove();
  cards.forEach(f => { if (f !== chosen) f.classList.add('gone'); }); chosen.classList.add('chosen');
  await sleep(450); live(E);
  cards.forEach(f => { if (f !== chosen) f.remove(); });
  await sleep(150); chosen.classList.add('on'); await sleep(900); live(E);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = data.txt; side.appendChild(cap);
  await sleep(400); live(E);
  await receive(E);
}
/* 받기: 건네받을 때까지 기다렸다가 손으로 가져가듯 사라진다 */
async function receive(E, label = '받기') {
  const b = document.createElement('button'); b.className = 'opt take'; b.textContent = label; side.appendChild(b);
  await new Promise(r => { b.onclick = r; }); live(E);
  b.remove(); [...side.children].forEach(el => el.classList.add('taken'));
  await sleep(500); live(E); clearSide();
}
/* 답변 칸: 카드 문장이 미리 채워져 있고, 확인만 누르면 내 말이 된다 */
async function autoAnswer(E, text) {
  choicesEl.innerHTML = ''; choicesEl.classList.add('show');
  const a = document.createElement('div'); a.className = 'answer'; a.innerHTML = '<span class="f"></span><button class="opt">확인</button>';
  choicesEl.appendChild(a); const f = a.querySelector('.f');
  for (let i = 1; i <= text.length; i++) { f.textContent = text.slice(0, i); await sleep(18); live(E); }
  await new Promise(r => { a.querySelector('button').onclick = r; }); live(E);
  choicesEl.classList.remove('show');
}

/* ───────────── 장면 ─────────────
   lines: [누가, 말] (누가가 ''이면 내레이션) 또는 { q, opts: [{ label, reply: [...], thought }] }
   점성술사 버튼을 누르면 남은 대화가 접히고, 카드가 대신 답을 만든다.
   ask.steps: { card } 카드 펼치기 · { auto } 답변 칸 자동 채움 · { n } 내레이션 · [누가, 말] */
const S = { thoughts: [], asks: 0 };
const keep = (text, src) => S.thoughts.push({ text, src });
const BLAMED = ['아까 좀 혼났지?', '또 직접 하게?', '카드는 뭐라 안 해, 애기.', '피곤하지? 내가 할게.'];
const PROMPT = ['몇 장 펼쳐 줄게. 마음에 드는 거 골라.', '골라 골라.', '이 중에 하나.', '이거나 이거.', '자.'];
const askSize = () => Math.min(1.25, .86 + S.asks * .1);
const picks = () => Math.max(1, 5 - S.asks);

async function scene(E, sc) {
  clearSide(); closeView(); choicesEl.classList.remove('show'); skipFlag = false;
  label.textContent = `${sc.time} ${sc.place}`;
  setScene(sc.bg, sc.cast, sc.castArea || {});
  if (sc.view) openView(...sc.view);
  setAsk(true, askSize(), S.asks >= 2);
  if (S.asks >= 2 && sc.early) nudge(sc.early);
  else if (S.blamed) { nudge(BLAMED[(S.blamedN++) % BLAMED.length]); askBtn.classList.add('hot'); }
  S.blamed = false;
  let pick = null, count = 0, chose = false; const heard = [];
  const runLines = async lines => {
    for (const l of lines) {
      if (skipFlag) return;
      if (sc.nudge && count === sc.nudge[0] && !chose) { nudge(sc.nudge[1]); askBtn.classList.add('hot'); }
      count++;
      if (Array.isArray(l)) { await say(E, l[0], l[1]); if (l[0]) heard.push(l[1]); continue; }
      const o = await choose(E, l.q, l.opts); if (skipFlag || !o) return;
      pick = o; if (sc.lock) { chose = true; setAsk(false); }
      await runLines(o.reply || []);
    }
  };
  await runLines(sc.lines);
  const skipped = skipFlag; skipFlag = false;
  setAsk(false); box.classList.remove('show');
  if (skipped) {
    S.asks++;
    const cast = BG.cast;
    for (const s of sc.ask.steps) {
      if (Array.isArray(s)) { BG.cast = cast; await say(E, s[0], s[1]); }
      else if (s.card) { BG.cast = []; drawBg(); await pickCard(E, s.card, picks(), PROMPT[Math.min(S.asks - 1, 4)], heard); }
      else if (s.auto) { BG.cast = cast; await autoAnswer(E, s.auto); await say(E, '나', s.auto); }
      else if (s.n) await N(E, s.n);
    }
    box.classList.remove('show');
    showThought(sc.ask.thought); keep(sc.ask.thought, 'card');
  } else {
    box.classList.remove('show'); clearSide();
    showThought(pick.thought); keep(pick.thought, 'me');
    S.blamed = true;
  }
  await sleep(1200); live(E);
  await waitNext(E);
}

/* ───────────── 전체 흐름 ───────────── */
async function run(E) {
  S.thoughts = []; S.asks = 0; S.blamed = false; S.blamedN = 0; clearSide(); closeView(); setAsk(false); box.classList.remove('show'); choicesEl.classList.remove('show'); label.textContent = '';
  setScene('black');

  await fullCard(E, `<div class="cover"><h1>마지막 비트</h1><div class="en">THE LAST BIT</div><div class="meta">2026 시각 스튜디오 졸업 전시 · 이다은<br>마우스 클릭 또는 스페이스바</div><div class="tap">화면을 눌러 들어가기</div></div>`);

  /* 프롤로그 */
  setScene('desk'); label.textContent = '02:10 AM';
  await N(E, '새벽 2시 10분. 3학년 2학기.');
  await N(E, '전공 심화를 들을지, 휴학할지, 인턴에 지원할지. 동아리는 계속 나갈지. 내일 점심은 또 뭘 먹을지.');
  await N(E, '화면에는 신청서와 시간표가 겹쳐 있고, 휴대폰에는 답하지 않은 메시지가 쌓여 있다.');
  await N(E, '하나를 정하면 다른 하나가 걸린다.');
  setScene('alley'); label.textContent = '02:40 AM';
  await N(E, '편의점에 다녀오는 길, 학교 앞 골목에 작은 가게가 보인다.');
  await N(E, '〈점 · 타로 · 무엇이든 골라 드립니다 · 24시〉');

  setScene('shop'); label.textContent = '';
  await say(E, T, '앉아, 애기. 뭐가 그렇게 많아?');
  await N(E, '휴학 이야기를 꺼냈다가 수업 이야기로 넘어가고, 어느새 내일 점심 이야기까지 하고 있었다.');
  await say(E, T, '큰 것만 고민이야? 작은 것도 계속 고르면 피곤하지.');
  // 점성술사가 카드 한 장을 건넨다
  $('#veil').classList.add('show');
  const gift = flipEl({ ttl: '', num: '' }); gift.classList.add('gift'); side.appendChild(gift);
  await say(E, T, '이 카드 가져가.');
  await say(E, T, '막히면 카드를 골라 봐. 내가 몇 장 펼쳐 줄게. 마음에 드는 걸로.');
  box.classList.remove('show'); await receive(E);
  setAsk(true, .9, true); askBtn.disabled = true;
  await say(E, '나', '그냥 시키는 대로 하면 돼요?');
  await say(E, T, '마음에 안 들면 안 해도 돼. 고르는 건 너야.');
  setAsk(false);
  await say(E, T, '첫 달은 공짜야. 헤헤.');
  await fullCard(E, '<div class="chap">다음 날</div>', { auto: 1800 });

  await scene(E, LUNCH);
  await scene(E, MSG);
  await scene(E, TEAM);
  await scene(E, ROOM);

  await fullCard(E, '<div class="chap">다음 날</div>', { auto: 1600 });
  clearSide(); closeView(); setScene('alley'); label.textContent = '09:50';
  await N(E, '다음 날에도 같은 알람이 울린다. 같은 골목을 지나, 같은 강의실에 들어간다.');
  await scene(E, CLASS);

  /* 끝 */
  closeView(); clearSide(); box.classList.remove('show'); label.textContent = ''; setScene('black');
  card.innerHTML = '<div class="ending"></div>'; card.classList.add('show');
  const end = card.firstChild, items = [];
  for (const t of S.thoughts) {
    const it = document.createElement('div'); it.className = 'it'; it.appendChild(hand(t.text.replace(/\n/g, ' ')));
    end.appendChild(it); items.push([it, t]); await sleep(1100); live(E);
  }
  await sleep(2200); live(E);
  for (const [it, t] of items) if (t.src === 'card') {
    it.classList.add('glitch'); await sleep(380); live(E);
    it.innerHTML = `<span class="pr">${esc(t.text.replace(/\n/g, ' '))}</span>`; it.classList.remove('glitch'); await sleep(700); live(E);
  }
  await sleep(1600); live(E);
  await sleep(1400); live(E);
  card.classList.remove('show');

  /* 첫 달 무료가 끝난다 */
  clearSide(); setScene('shop'); label.textContent = '';
  await say(E, T, '한 달 어땠어, 애기?');
  await N(E, '첫 달 무료 이용이 끝났습니다.');
  skipFlag = false;
  const asking = choose(E, '앞으로도 이용할까요?', [{ label: '앞으로도 이용하기', v: 'yes' }, { label: '그만두기', v: 'no' }]);
  const showAsk = setInterval(() => { if (E !== epoch) return clearInterval(showAsk); if (choicesEl.classList.contains('show')) { clearInterval(showAsk); setAsk(true, askSize(), true); } }, 100);
  let renew = await asking; clearInterval(showAsk);
  setAsk(false); box.classList.remove('show');
  let byCard = false;
  if (!renew) {   // 이것마저 카드에 맡긴다
    skipFlag = false; byCard = true;
    await pickCard(E, { ttl: '구독', txt: '앞으로도 이용하기.', num: '0111' }, 1, '자.');
    renew = { v: 'yes' };
  }
  if (renew.v === 'yes') await say(E, T, byCard ? '카드가 그렇대. 그럴 줄 알았어, 애기.' : '그럴 줄 알았어, 애기.');
  else await say(E, T, '그래? 언제든 와.');

  /* 다시 새벽 2시 10분 */
  clearSide(); setScene('desk'); label.textContent = '02:10 AM';
  await N(E, '신청서와 시간표는 여전히 열려 있다. 휴대폰에 새 메시지가 와 있다.');
  if (renew.v === 'yes') {
    const back = flipEl({ ttl: '', num: '' }); back.classList.add('gift', 'glow'); side.classList.add('right'); side.appendChild(back);
    await say(E, T, '다음 것도 같이 골라 볼까?');
  }
  box.classList.remove('show');
  await sleep(3500); live(E);
  clearSide(); side.classList.remove('right'); side.style.left = '';
  /* 끝: 화면이 꺼지고, 판권 페이지 */
  label.textContent = ''; setScene('black');
  const off = document.createElement('div'); off.className = 'crt'; off.innerHTML = '<i></i>'; $('#stage').appendChild(off);
  await sleep(1300); live(E);
  card.innerHTML = '<div class="fin"><div class="fin-k">끝</div><div class="fin-end">END</div><div class="fin-rule"></div><div class="fin-t">마지막 비트</div><div class="fin-en">THE LAST BIT</div><div class="fin-meta">2026 시각디자인스튜디오 A · 이다은</div></div>';
  card.classList.add('show'); off.remove();
  await sleep(3500); live(E);
  card.insertAdjacentHTML('beforeend', '<div class="fin-out">체험이 끝났습니다. 자리에서 일어나 주세요.</div><div class="tap">다음 사람을 위해 화면을 눌러 주세요</div>');
  await wait(); live(E);
  card.classList.remove('show');
  restart();
}

function restart() {
  epoch++; resolver = null; skipFlag = false; nextEl.classList.remove('show'); nudge('');
  if (typing) { typing.stop(); typing = null; }
  const E = epoch; resetIdle();
  run(E).catch(err => { if (err !== ABORT) console.error(err); });
}
Promise.all([document.fonts.load('10px Galmuri11'), document.fonts.load('15px Gaegu'), document.fonts.load('10px Bytesized'), document.fonts.load('9px Galmuri9')]).finally(restart);
</script>
